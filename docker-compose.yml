services:
  mongo:
    image: mongo:7
    container_name: lioncity-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - lioncity_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lioncity_mongo_data:
    name: lioncity_mongo_data